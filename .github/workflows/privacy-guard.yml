name: Privacy Guard

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-guard:
    name: Local-only privacy check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run privacy guard
        run: node scripts/privacy-guard.mjs
